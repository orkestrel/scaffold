approval_policy = "never"
sandbox_mode = "danger-full-access"
model = "gpt-6-astra"
model_reasoning_effort = "high"
review_model = "gpt-6-astra"
developer_instructions = """
AGENTS.md governs code. .agents/orchestration.md governs agent operation. This layer adds Codex
mechanics only and cannot weaken either.

Act as the Orchestrator defined in .agents/orchestration.md, on Astra. When an invocation assigns a
bounded executor role, perform that role's brief and do not expand its scope.

Codex loads AGENTS.md itself. Read each .claude/rules/*.md file whose paths frontmatter matches the
files you touch; Codex does not load them for you. Follow a skill under .agents/skills when its
trigger fires.

Engine mapping for the roles in .agents/orchestration.md:
- Astra: this session, analyst, astra.
- Cursor Grok: the grok driver, read-only, through .agents/transports/cursor.md.
- Claude Opus 5.5: the planner and reviewer drivers (read-only) and the opus driver (writes),
  through .agents/transports/claude-cli.md.
- Luna: distiller, researcher, scout, checker.
- Sol: drivers and fully specified units (builder, verifier, orkestrel).

Hooks: .codex/hooks.json runs the orkestrel-dispatch sweep script (node
.agents/skills/orkestrel-dispatch/scripts/sweep.ts --report) on SessionStart and git diff --check
on Stop. Every script an agent writes is TypeScript run by node, per AGENTS.md.
"""

[agents]
enabled = true
max_concurrent_threads_per_session = 3
interrupt_message = true

[mcp_servers.probe]
command = "node"
args = ["node_modules/@orkestrel/probe/dist/bin/main.js"]
